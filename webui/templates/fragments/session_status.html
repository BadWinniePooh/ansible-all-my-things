<span class="status-badge {{ 'unlocked' if token_unlocked else 'locked' }}">
  API token<span class="spacer"></span><span class="state">{{ 'unlocked' if token_unlocked else 'locked' }}</span>
</span>
<span class="status-badge {{ 'unlocked' if vault_unlocked else 'locked' }}">
  Vault password<span class="spacer"></span><span class="state">{{ 'unlocked' if vault_unlocked else 'locked' }}</span>
</span>
{% if token_unlocked or vault_unlocked %}
<form method="post" action="/session/lock">
  <button class="btn-sm btn-block" type="submit">Lock session</button>
</form>
{% endif %}
