---
# Pinned rtk release tag (v-prefixed). See
# https://github.com/rtk-ai/rtk/releases for available versions.
# Updated automatically by playbooks/update-versions/perform-updates.yml.
rtk_version: "v0.43.0"

# Maps an Ansible architecture fact to the full rtk release asset filename.
# Note the asymmetric target triples: x86_64 ships a musl build, aarch64 a
# gnu build. The dest filename of the downloaded archive MUST equal this value
# so get_url can look the checksum up by basename in checksums.txt.
rtk_platform_map:
  x86_64: "rtk-x86_64-unknown-linux-musl.tar.gz"
  aarch64: "rtk-aarch64-unknown-linux-gnu.tar.gz"

# SHA-256 checksums for the two supported release archives, named after the
# target triple (not just the arch) since x86_64 and aarch64 ship different
# libc builds. Compute (download to file first -- pipe-only sha256sum can
# truncate and give the wrong hash):
#   curl -sL https://github.com/rtk-ai/rtk/releases/download/<tag>/<asset> -o /tmp/rtk.tar.gz
#   sha256sum /tmp/rtk.tar.gz
rtk_sha256_x86_64_musl: "ff8a1e7766496e175291a85aeca1dc97c9ff6df33e51e5893d1fbc78fea2a609"
rtk_sha256_aarch64_gnu: "5519f7ca12e5c143a609f0d28a0a77b97413a8dce31c2681f1a41c24519a8731"
