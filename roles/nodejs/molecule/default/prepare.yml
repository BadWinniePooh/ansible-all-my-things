---
# A single testuser is sufficient: this role installs Node.js and its
# global npm packages system-wide (no per-user state), so there is no
# per-user divergence for a second test user to exercise.
- name: Prepare container
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Create testuser
      ansible.builtin.user:
        name: testuser
        state: present
        create_home: true
