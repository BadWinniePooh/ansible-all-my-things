---
- name: Setup user accounts
  hosts: linux
  become: true
  
  vars:
    ansible_user: "{{ admin_user_on_fresh_system }}"

    console_users:
      - name: "{{ my_ansible_user }}"
        password: "{{ my_ansible_user_password | default('my_ansible_user_password must be configured in inventory/group_vars/all/vault.yml') }}"

    all_users: "{{ console_users + desktop_users }}"

    ssh_public_key: "{{ my_ssh_public_key | default('my_ssh_public_key must be configured in inventory/group_vars/all/vault.yml') }}"

    # The configured key plus the operator's own, newline-separated as the
    # authorized_key module expects for several keys in one task.
    ssh_public_keys: "{{ ([ssh_public_key] + my_additional_ssh_public_keys) | join('\n') }}"

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted

  pre_tasks:
    # Guards the vault contract before any account is created. Also catches
    # vault files predating vault_my_ansible_user_name, which hardcoded the
    # account name in vars.yml instead.
    - name: Assert the ansible user name is defined in the vault
      ansible.builtin.assert:
        that:
          - vault_my_ansible_user_name is defined
          - vault_my_ansible_user_name | length > 0
        fail_msg: >-
          vault_my_ansible_user_name is missing or empty in
          inventories/group_vars/all/vault.yml. Define the name of the
          ansible user account there. See
          inventories/group_vars/all/vault-template.yml.

    # Also catches vault files predating the vault_desktop_users list, which
    # defined one vault_<name> mapping per user instead.
    - name: Assert desktop users are defined in the vault
      ansible.builtin.assert:
        that:
          - vault_desktop_users is defined
          - vault_desktop_users | length > 0
        fail_msg: >-
          vault_desktop_users is missing or empty in
          inventories/group_vars/all/vault.yml. Define at least one desktop
          user there as a list of entries with name, password and
          exa_api_key. See inventories/group_vars/all/vault-template.yml.

    - name: Assert every desktop user entry is complete
      no_log: true # Prevent logging the passwords
      ansible.builtin.assert:
        that:
          - item.name is defined and item.name | length > 0
          - item.password is defined and item.password | length > 0
          - item.exa_api_key is defined and item.exa_api_key | length > 0
        fail_msg: >-
          An entry in vault_desktop_users is incomplete. Every entry needs a
          non-empty name, password and exa_api_key. See
          inventories/group_vars/all/vault-template.yml.
      loop: "{{ vault_desktop_users }}"

    - name: Assert the additional SSH public keys are a list
      ansible.builtin.assert:
        that:
          - my_additional_ssh_public_keys is sequence
          - my_additional_ssh_public_keys is not string
        fail_msg: >-
          vault_my_additional_ssh_public_keys in
          inventories/group_vars/all/vault.yml must be a list of public key
          strings, one entry per key. See
          inventories/group_vars/all/vault-template.yml.

  tasks:
    - name: Setup accounts "{{ all_users | map(attribute='name') | join(', ') }}"
      no_log: true # Prevent logging the passwords
      user:
        name: "{{ item.name }}"
        password: "{{ item.password | password_hash('sha512', 65534 | random(seed=item.name) | string) }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        state: present
      loop: "{{ all_users }}"

    - name: Allow passwordless sudo for ansible user
      lineinfile:
        path: /etc/sudoers.d/50-ansible-user-does-not-need-password
        regexp: '^{{ my_ansible_user }}'
        line: '{{ my_ansible_user }} ALL=(ALL) NOPASSWD:ALL'
        validate: 'visudo -cf %s'
        create: yes
        state: present

    - name: Add SSH public keys to "{{ all_users | map(attribute='name') | join(', ') }}"
      no_log: true # Prevent logging the passwords
      authorized_key:
        user: "{{ item.name }}"
        key: "{{ ssh_public_keys }}"
        state: present
      loop: "{{ all_users }}"

    - name: Disable password authentication for SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-disable-password-auth.conf
        content: "PasswordAuthentication no\n"
        owner: root
        group: root
        mode: '0644'
      notify: Restart SSH

    - name: .bash_profile must exist
      no_log: true # Prevent logging the passwords
      file:
        path: "/home/{{ item.name }}/.bash_profile"
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: '0644'
        state: touch
        modification_time: preserve
        access_time: preserve
      become: true
      loop: "{{ all_users }}"

    - name: Load .bashrc for SSH login
      no_log: true # Prevent logging the passwords
      blockinfile:
        path: /home/{{ item.name }}/.bash_profile
        insertafter: '^{$'
        block: |
          if [ -f ~/.bashrc ]; then
              . ~/.bashrc
          fi
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Load .bashrc for non-login shells"
        state: present
      loop: "{{ all_users }}"
