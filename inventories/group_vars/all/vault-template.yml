---
# Documentation of the secrets is given in `vars.yml`

# "my_ansible_user" defined in vars.yml
# Enter the password for that user here
vault_my_ansible_user_name: "PROVIDE_USER_NAME_HERE"
vault_my_ansible_user_password: "PROVIDE_PASSWORD_HERE"

# This is the name registered for the key in hcloud and aws
# Usually the file name of the key without extension is used
vault_my_ssh_key_name: "PROVIDE_SSH_KEY_NAME_HERE"

vault_my_ssh_public_key: "PROVIDE_SSH_PUBLIC_KEY_HERE"

vault_gnome_keyring_password: "PROVIDE_GNOME_KEYRING_PASSWORD_HERE"

vault_windows_admin_password: "PROVIDE_STRONG_WINDOWS_PASSWORD_HERE"

# Desktop user accounts created on every managed host. This list is the
# single definition of who exists: add, rename or remove an entry here and
# nothing outside this file needs to change. At least one entry is required.
#
# name:        Linux account name (also the login name for SSH and the
#              desktop session).
# password:    Login password for that account.
# exa_api_key: Exa API key wired into the user's MCP configuration. Any
#              placeholder string works when Exa search is not used.
vault_desktop_users:
  - name: "PROVIDE_USER_NAME_HERE"
    password: "PROVIDE_USER_PASSWORD_HERE"
    exa_api_key: "PROVIDE_USER_EXA_API_KEY_HERE"
#  - name: "PROVIDE_SECOND_USER_NAME_HERE"
#    password: "PROVIDE_SECOND_USER_PASSWORD_HERE"
#    exa_api_key: "PROVIDE_SECOND_USER_EXA_API_KEY_HERE"

